<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ReelPilot — Connecting</title>
<style>
  :root { --bg:#ffffff; --ink:#15171a; --muted:#5c6470; --line:#e6e8eb; --accent:#111; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0f1114; --ink:#eef0f3; --muted:#9aa3ae; --line:#252a30; --accent:#fff; }
  }
  :root[data-theme="dark"] { --bg:#0f1114; --ink:#eef0f3; --muted:#9aa3ae; --line:#252a30; --accent:#fff; }
  body { margin:0; background:var(--bg); color:var(--ink); display:grid; place-items:center;
         min-height:100vh; font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .card { max-width:460px; padding:32px 16px; text-align:center; }
  h1 { font-size:1.3rem; margin:0 0 .4em; }
  p { color:var(--muted); margin:.4em 0; }
  a.btn { display:inline-block; margin-top:1.2em; padding:.6em 1.1em; border:1px solid var(--line);
          border-radius:8px; color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<div class="card">
  <h1>Handing you back to ReelPilot…</h1>
  <p>This page passes the TikTok login back to ReelPilot on your own computer.</p>
  <p>Nothing is stored here.</p>
  <a class="btn" id="manual" href="#">Continue manually</a>
</div>
<script>
  var target = "https://localhost:8723/callback" + window.location.search + window.location.hash;
  document.getElementById("manual").href = target;
  window.location.replace(target);
</script>
</body>
</html>
